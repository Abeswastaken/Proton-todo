name: Release

# Push main to the `release` branch to build a signed APK and publish it as a GitHub
# Release tagged with the version in version.txt.
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="v$(tr -d '[:space:]' < version.txt)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "proton-todo-$VERSION.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Proton To-Do ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: proton-todo-*.apk
